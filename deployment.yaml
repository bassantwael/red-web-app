apiVersion: apps/v1
kind: Deployment
metadata:
  name: red-web-app-deployment
  labels:
    app: red-web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: red-web-app
  template:
    metadata:
      labels:
        app: red-web-app
    spec:
      imagePullSecrets:
        - name: nexus-secret
      containers:
      - name: red-web-app
        image: host.minikube.internal:5000/my-red-webapp:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: red-web-app-service
spec:
  type: NodePort
  selector:
    app: red-web-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
