apiVersion: apps/v1
 
kind: Deployment
 
metadata:
 
  name: telco-app
 
  namespace: rancher-stress
 
  labels:
 
    app: nginx-app
 
strategy:
 
  type: Recreate
 
spec:
 
  replicas: 3
  selector:
 
    matchLabels:
 
      app: telco-app
 
  template:
 
    metadata:
 
      labels:
 
        app: telco-app
 
    spec:
            #securityContext:
              #runAsUser: 0  # Run as root
      containers:
 
        - name: telco-app
 
          #securityContext:
          # privileged: true  # Only if absolutely necessary
 
          image: 10.115.55.84:7008/telco-webapp
 
          imagePullPolicy: Always
 
          ports:
 
            - name: telco-app-port
 
              containerPort: 80
 
              protocol: TCP
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -i -e 's/#d32f2f;/#1976d2;/g' /usr/share/nginx/html/index.html
              sed -i -e 's/#b71c1c;/#0d47a1;/g' /usr/share/nginx/html/index.html
 
---
